[rocks]

[treesitter]
auto_highlight = "all"
auto_install = true

[config]
auto_setup = false

[plugins]
# Rocks modules
"rocks-config.nvim" = "1.3.1"
"rocks-git.nvim" = "1.3.1"
"rocks-treesitter.nvim" = "scm"
nvim-treesitter = "0.9.2"

# Plugins
"auto-save.nvim" = "scm"
"mini.base16" = "0.9.0"
neorg = "8.4.0"

# Tree-sitter
tree-sitter-json = "scm"
tree-sitter-rust = "scm"
tree-sitter-toml = "scm"

[plugins."nvim-tree.lua"]
git = "nvim-tree/nvim-tree.lua"
rev = "v1.3^{}"
